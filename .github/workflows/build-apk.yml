name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR_VER"
          if [ -z "$JAVA_MAJOR_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR_VER" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer. Detected version: $JAVA_MAJOR_VER"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore missing. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified or created."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Found APK files in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: Expected APK file does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "Successfully verified APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TEMP_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          CLEAN_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="app"
          fi

          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset must be an .apk file: $ASSET_PATH"
              exit 1
              ;;
          esac

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES="### Automated Debug APK Build

This is an automatically generated debug APK.
- **Built by:** GitHub Actions
- **Run number:** ${GITHUB_RUN_NUMBER}
- **Run attempt:** ${GITHUB_RUN_ATTEMPT}
- **Source commit SHA:** ${GITHUB_SHA}

> **Notice:**
> - This APK is intended for testing and development purposes.
> - This is not a Play Store production release.
> - This APK is signed only with a temporary debug keystore."

          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$TAG"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ✅ Debug APK Build and Release Succeeded!

          - **Release Tag:** \`${TAG}\`
          - **Release Title:** Debug APK Build #${GITHUB_RUN_NUMBER}
          - **Release URL:** [View Release](${RELEASE_URL})
          - **APK Asset Filename:** \`${ASSET_NAME}\`

          You can download the APK directly to your phone or computer from the **Assets** section of the [GitHub Release page](${RELEASE_URL}).
          *(The standard GitHub Actions artifact \`app-debug-apk\` is also available as a backup).*
          EOF
          else
            echo "::warning::Release publishing failed or was skipped, but the APK build succeeded."
            echo "Actions artifact 'app-debug-apk' is preserved and available."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Built (Release Publishing Incomplete)

          - **Build Status:** Succeeded
          - **Backup Artifact:** \`app-debug-apk\`

          Release publishing did not complete, but the debug APK was built successfully. You can download the **\`app-debug-apk\`** artifact from the Artifacts section of this workflow run.
          EOF
          fi
